import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.13' apply false
    id 'java'
}

def targets = new JsonSlurper().parse(file('versions.json'))
def mc = providers.gradleProperty('mc').getOrElse('26.2')
def target = targets[mc]
if (target == null) throw new GradleException("Unsupported Minecraft version: ${mc}")
def unobfuscated = mc.startsWith('26.')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = 'com.serverswitcher'
base.archivesName = "serverswitcher-${mc}"
layout.buildDirectory = file("build/${mc}")

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
sourceSets.main.java.srcDirs += [
    "src/compat/input-${target.input}/java",
    "src/compat/render-${target.render}/java",
    "src/compat/client-${target.client}/java"
]
def widenerDir = "src/compat/resources/${unobfuscated ? 'official' : 'named'}"
sourceSets.main.resources.srcDir widenerDir
loom { accessWidenerPath = file("${widenerDir}/serverswitcher.accesswidener") }

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    def modConfig = unobfuscated ? 'implementation' : 'modImplementation'
    add(modConfig, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modConfig, "net.fabricmc.fabric-api:fabric-api:${target.fabric}")
    add(modConfig, "me.shedaniel.cloth:cloth-config-fabric:${target.cloth}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    add(modConfig, "com.terraformersmc:modmenu:${target.modmenu}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    def properties = [version: project.version, minecraft: mc,
                      java: target.java, loader: project.loader_version]
    inputs.properties(properties)
    filesMatching(['fabric.mod.json', 'serverswitcher.mixins.json']) { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.release = target.java as int }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
jar { from('LICENSE') { rename { "LICENSE_${base.archivesName.get()}" } } }
tasks.register('collectRelease', Copy) {
    dependsOn 'build'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-dev.jar', '*-dev-sources.jar'
    }
    into layout.projectDirectory.dir('dist')
}
